<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>潮 TIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;600;900&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* VOICE  quiet, tender, a lullaby at sea
   IDEA   you are not the boat — you are the sea
   PICTURE a paper boat on a living wave, sky turning dusk→night→dawn
   COLOUR sky gradient leads, ink-blue water, warm lantern accent
   TYPE   Noto Serif TC for the one big glyph, Cormorant italic for latin */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1a1530;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff8ee;font-family:"Noto Serif TC",serif}
.hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;opacity:0;transition:opacity .6s}
.hud.on{opacity:1}
.sc{font-size:34px;font-weight:300;letter-spacing:.02em;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.m{font:500 italic 18px "Cormorant Garamond",serif;opacity:.75;margin-top:12px}
.mul{font:500 italic 22px "Cormorant Garamond",serif;color:#ffd08a;opacity:0;transition:opacity .3s,transform .3s}
.mul.on{opacity:1}
.fv{position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .6s}.fv.on{opacity:1}.fv i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ffe2a6);box-shadow:0 0 12px #ffcf8a;transition:width .25s}
.sc.fev{color:#ffd08a}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
.scr.off{opacity:0}
.t{font-size:clamp(110px,26vw,180px);font-weight:900;line-height:1;letter-spacing:-.02em;text-shadow:0 6px 40px rgba(60,20,60,.35)}
.st{font:500 italic 22px "Cormorant Garamond",serif;letter-spacing:.5em;margin:8px 0 0 .5em;opacity:.8}
.hint{margin-top:22vh;font-size:15px;font-weight:300;letter-spacing:.35em;opacity:.8;animation:br 2.4s ease-in-out infinite}
@keyframes br{50%{opacity:.35}}
.big{font-size:clamp(64px,18vw,110px);font-weight:300;line-height:1}
.lbl{font-size:13px;letter-spacing:.4em;opacity:.65;margin-top:10px}
.best{font:500 italic 20px "Cormorant Garamond",serif;opacity:.7;margin-top:26px}
.ln{font-size:15px;opacity:.85;margin-top:8px;color:#ffd9a8}
.ld{display:inline-block;width:7px;height:10px;border-radius:50%;background:#fff1d6;box-shadow:0 0 8px 2px #ffb36b;vertical-align:1px}
.cr{display:inline-block;width:9px;height:9px;transform:rotate(45deg);border:1px solid currentColor;vertical-align:2px;margin-right:4px}
.nb{color:#ffd08a;font-size:14px;letter-spacing:.3em;margin-top:10px;font-family:"Noto Serif TC",serif;font-style:normal}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="fv" id="fv"><i id="fvi"></i></div><div class="hud" id="hud"><div><div class="sc" id="sc">0</div><div class="mul" id="mul">×2</div></div><div class="m" id="dm">0 m</div></div>
  <div class="scr" id="title"><div class="t">潮</div><div class="st">TIDE</div><div class="hint">按住 · 放開</div></div>
  <div class="scr off" id="over"><div class="big" id="fs">0</div><div class="lbl" id="fd">0 m</div><div class="best" id="fb"></div></div>
</div>
<script>
{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,DPR,Y0;
const DX=6,MARG=300,BX=.26;let BZ=1,G=.42,STORMS=[],Q={};
let N=0,hh,vv,base=0;
function resize(){
  DPR=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;Y0=H*0.64;BZ=W<520?.84:1;
  const n=Math.ceil((W+MARG*2)/DX)+2;
  if(n!==N){const nh=new Float32Array(n),nv=new Float32Array(n);if(hh){nh.set(hh.subarray(0,Math.min(n,N)));nv.set(vv.subarray(0,Math.min(n,N)))}hh=nh;vv=nv;N=n}
}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null,master,ocean;
function audio(){
  if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
  const len=AC.sampleRate*4,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
  ocean=AC.createGain();ocean.gain.value=.22;s.connect(f);f.connect(ocean);ocean.connect(master);s.start();
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.09;lg.gain.value=180;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
}
let noiseBuf=null;
function noise(dur,freq,vol,q=.7){
  if(!AC)return;if(!noiseBuf){const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain(),t=AC.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28];
function tone(semi,dur=.9,vol=.16,type='sine',delay=0){
  if(!AC||!isFinite(semi))return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=523.25*Math.pow(2,semi/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
  const o2=AC.createOscillator(),g2=AC.createGain();o2.frequency.value=o.frequency.value*2.01;g2.gain.setValueAtTime(vol*.25,t);g2.gain.exponentialRampToValueAtTime(.001,t+dur*.5);o2.connect(g2);g2.connect(master);o2.start(t);o2.stop(t+dur);
}
function thunder(v){if(!AC)return;noise(2.2,120,.35*v,.4);noise(.6,600,.12*v,.4)}
function thud(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.5);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+.7)}

/* ---------- state ---------- */
let state='title',T=0,score=0,dist=0,camX=0,camY=0,shake=0,slow=1,slowT=0,flash=0;
let best=0,bestD=0,totalLan=0,skinSel=0;try{bestD=+localStorage.getItem('tide_bestd')||0}catch(e){}
const MUT=['','輕','鯨','燈','疾','變','怪'];let mut=0;const rollMut=()=>{mut=Math.random()<.25?0:1+Math.floor(Math.random()*6)};rollMut();
let rbow=null,jellies=[],ducks=[],fol=[],hist=[],nextDuck=1600,morph=null,oris=[],nextOri=2200,gS=1,flapB=0,bottles=[],nextBottle=1300;const maxF=()=>(skinSel===5?2:1)+flapB;let passedBest=false;try{best=+localStorage.getItem('tide_best')||0;totalLan=+localStorage.getItem('tide_lan')||0;skinSel=+localStorage.getItem('tide_skin')||0}catch(e){}
const SKINS=[
 {n:'白',c:['#efe7da','#d8cdbb','#fffaf2','#e6dccb'],t:'255,255,255',cost:0},
 {n:'櫻',c:['#f7c9d2','#e3a5b3','#ffe3e9','#efbcc8'],t:'255,190,210',cost:40},
 {n:'青',c:['#a9d8d2','#80b9b2','#d6f2ed','#a3d6cf'],t:'150,240,225',cost:120},
 {n:'墨',c:['#3b3b44','#26262d','#5a5a66','#474752'],t:'170,170,200',cost:300},
 {n:'金',c:['#f2c86b','#d4a443','#ffe6a6','#e9c078'],t:'255,214,120',cost:700},
 {n:'星',c:['#2b3870','#1c2552','#4252a0','#33408a'],t:'190,200,255',cost:1500,star:1}];
if(skinSel>=SKINS.length||SKINS[skinSel].cost>totalLan)skinSel=0;
const MT={flip:{t:n=>'翻'+n,v:[1,2,4,7,12,18]},gull:{t:n=>'踏'+n,v:[1,3,5,8,12]},air:{t:n=>n+'s',v:[1.5,2.5,3.5,4.5]},lan:{t:n=>'●'+n,v:[15,30,50,80,120,180]},m:{t:n=>n+'m',v:[200,400,700,1000,1500,2200]},pst:{t:n=>'連'+n,v:[2,3,4,6,8]},fish:{t:n=>'魚'+n,v:[5,12,20,32]},whale:{t:n=>'鯨'+n,v:[1,2,3]},geo:{t:n=>'湧'+n,v:[1,3,5,8]},duck:{t:n=>'鴨'+n,v:[1,3,5,6]}};
let mlv={},mset=['m','flip','lan'];try{mlv=JSON.parse(localStorage.getItem('tide_mlv')||'{}');const q=JSON.parse(localStorage.getItem('tide_mset')||'null');if(Array.isArray(q)&&q.length===3&&q.every(k=>MT[k]))mset=q}catch(e){}
const mval=k=>{const v=MT[k].v,l=mlv[k]||0;return l<v.length?v[l]:Math.round(v[v.length-1]*(1+.5*(l-v.length+1)))};
let ST={},mdone=[false,false,false];
const save=()=>{try{localStorage.setItem('tide_mlv',JSON.stringify(mlv));localStorage.setItem('tide_mset',JSON.stringify(mset));localStorage.setItem('tide_best',best);localStorage.setItem('tide_lan',totalLan);localStorage.setItem('tide_skin',skinSel)}catch(e){}};
const boat={x:0,y:0,vx:0,vy:0,a:0,va:0,air:false,airT:0,rot:0,dead:false,deadT:0};
let swellA=0,safeT=0,boss=null,nextBoss=16000,bossZ=null,curBio=0,spouts=[],nextSpout=9500,clouds=[],surfZ=null,surf2=null,nextSurf=8000,revives=0,geos=[],nextGeo=1800,beatT=0,runLan=0,pstreak=0,fishes=[],nextFish=2000,nextLH=5000,stormOn=false,stormK=0,swellT=0,boltT=0,rain=[],gulls=[],cranes=[],nextGull=1500,nextCrane=1100,shield=0,fever=0,feverT=0,zoom=1,whales=[],nextWhale=3200,rocks=[],lanterns=[],parts=[],pops=[],stars=[],nextRock=0,nextLan=0,combo=0,chain=0,perfects=0,taught=false;
let press=null; // {x(screen),charge}
for(let i=0;i<120;i++)stars.push({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.3+.3,p:Math.random()*6});
const hills=[];for(let L=0;L<3;L++){const a=[];for(let i=0;i<64;i++)a.push(Math.random());hills.push(a)}

function reset(keepWater){
  if(!keepWater){hh.fill(0);vv.fill(0)}base=-Math.floor(MARG/DX);
  Object.assign(boat,{x:W*BX,y:keepWater?surf(W*BX):Y0,vx:keepWater?1.2:2.4,vy:0,a:0,va:0,air:false,airT:0,rot:0,dead:false,deadT:0});
  camX=0;camY=0;score=0;dist=0;combo=0;chain=0;perfects=0;rocks=[];lanterns=[];parts=[];pops=[];
  nextRock=W*2.8+600;rbow=null;boat.rail=false;jellies=[];boat.under=false;ducks=[];fol=[];hist=[];nextDuck=1600;G=mut===1?.3:.42;ST={duck:0,flip:0,gull:0,air:0,lan:0,m:0,pst:0,fish:0,whale:0,geo:0};mdone=[false,false,false];revives=0;safeT=0;morph=null;oris=[];nextOri=mut===5?900:2200;gS=1;flapB=0;bottles=[];nextBottle=1300;boss=null;nextBoss=mut===6?6000:16000;bossZ=null;curBio=0;spouts=[];nextSpout=9500;clouds=[];surfZ=null;surf2=null;nextSurf=8000;geos=[];nextGeo=1800;runLan=0;pstreak=0;fishes=[];nextFish=2000;nextLH=5000;stormOn=false;stormK=0;rain=[];gulls=[];cranes=[];nextGull=1500;nextCrane=1100;shield=skinSel===3?1:0;passedBest=false;fever=0;feverT=0;zoom=1;nextLan=W*.9;nextWhale=mut===2?1500:3200;whales=[];slow=1;slowT=0;
  makePlan();
}
reset();

/* ---------- water ---------- */
const col=x=>(x/DX)-base;
function surf(x){const f=col(x),i=Math.floor(f),t=f-i;if(i<0||i>=N-1)return Y0;return Y0+hh[i]*(1-t)+hh[i+1]*t}
function slope(x){return (surf(x+8)-surf(x-8))/16}
function svel(x){const i=Math.round(col(x));return(i<0||i>=N)?0:vv[i]*2}
function kick(x,amt,r){const c=col(x),R=r/DX;for(let i=Math.max(1,Math.floor(c-R*2));i<Math.min(N-1,c+R*2);i++){const d=(i-c)/R;vv[i]+=amt*Math.exp(-d*d)}}
function stepWater(){
  const want=Math.floor((camX-MARG)/DX);
  if(want>base){const s=Math.min(N,want-base);hh.copyWithin(0,s);vv.copyWithin(0,s);hh.fill(0,N-s);vv.fill(0,N-s);base=want}
  for(let k=0;k<2;k++){
    for(let i=1;i<N-1;i++){vv[i]+=.24*(hh[i-1]+hh[i+1]-2*hh[i])-.0012*hh[i];vv[i]*=.997}
    for(let i=1;i<N-1;i++){hh[i]+=vv[i];if(hh[i]<-H*.42){hh[i]=-H*.42;vv[i]*=.5}else if(hh[i]>H*.3){hh[i]=H*.3;vv[i]*=.5}}
  }
}

/* ---------- world gen ---------- */
function spawn(){
  const ahead=camX+W+MARG;
  while(nextRock<ahead){
    if(blockedRock(nextRock)){nextRock+=120;continue}
    if(nextRock>3500&&Math.random()<.22){const w=150+Math.random()*40,h=165+Math.random()*45,g=80+Math.random()*14;rocks.push({x:nextRock,w,h,g,arch:true,passed:false,bio:bDom(nextRock),ph:Math.random()*9});
      for(let i=0;i<3;i++)lanterns.push({x:nextRock-40+i*40,y:Y0-g*.5,got:false,p:i,gold:i===1});
      for(let i=0;i<4;i++)lanterns.push({x:nextRock-75+i*50,y:Y0-h-60-Math.sin(i/3*Math.PI)*40,got:false,p:i,gold:false});
      nextRock+=(980-Math.min(340,dist*.04))*(.8+Math.random()*.55);continue}
    const lvl=Math.min(1,dist/7000),w=46+Math.random()*44,h=45+Math.random()*(45+105*lvl);
    const pts=[];const n=7;for(let i=0;i<=n;i++){const t=i/n,e=1-Math.abs(t*2-1);pts.push([-w/2+w*t,-(h*Math.pow(e,.8))*(.82+Math.random()*.2)])}
    pts[Math.floor(n/2)][1]=-h;
    rocks.push({x:nextRock,w,h,pts,passed:false,bio:bDom(nextRock)});
    // lantern arc over the rock
    const k=3+Math.floor(Math.random()*3),top=h+70+Math.random()*80;
    for(let i=0;i<k;i++){const t=k===1?.5:i/(k-1);lanterns.push({x:nextRock-90+180*t,y:Y0-top-Math.sin(t*Math.PI)*60,got:false,p:Math.random()*6,gold:false})}
    nextRock+=(980-Math.min(340,dist*.04))*(.8+Math.random()*.55);
  }
  while(nextLan<ahead){
    if(inStorm(nextLan)){const h=160+Math.random()*200;for(let i=0;i<6;i++)lanterns.push({x:nextLan+i*46,y:Y0-h-Math.sin(i/5*Math.PI)*70,got:false,p:i,gold:i===5&&Math.random()<.5});nextLan+=360;continue}
    if(Math.abs(nextLan-nearestRock(nextLan))>260){
      const k=2+Math.floor(Math.random()*4),h=90+Math.random()*220,gold=Math.random()<.12;
      for(let i=0;i<k;i++)lanterns.push({x:nextLan+i*48,y:Y0-h-Math.sin(i/(k)*Math.PI)*40,got:false,p:Math.random()*6,gold:gold&&i===k-1});
    }
    nextLan+=(320+Math.random()*360)*(mut===3?.45:1);
  }
  if(nextWhale<ahead){
    const x=nextWhale;{
    whales.push({x,t:0,on:false,used:false});
    for(let i=0;i<7;i++)lanterns.push({x:x+140+i*44,y:Y0-330-Math.sin(i/6*Math.PI)*110,got:false,p:i,gold:i===3});
    nextWhale=Q.whale.shift()??1e12;}
  }
  while(nextGull<ahead){if(busyNear(nextGull)){nextGull+=500;continue}const n=1+(Math.random()<.4?1:0)+(dist>2500&&Math.random()<.3?1:0);for(let i=0;i<n;i++)gulls.push({x:nextGull+i*90,y:Y0-150-Math.random()*170-i*30,p:Math.random()*6,dead:false,vy:0});nextGull+=700+Math.random()*900}
  if(nextCrane<ahead&&busyNear(nextCrane))nextCrane+=500;else if(nextCrane<ahead){cranes.push({x:nextCrane,y:Y0-230-Math.random()*120,got:false,p:0});nextCrane+=3800+Math.random()*2400}
  gulls=gulls.filter(g=>g.x>camX-200&&g.y>-2000);cranes=cranes.filter(c=>c.x>camX-200&&!c.got);
  if(nextSpout<ahead){spouts.push({x:nextSpout,used:false});nextSpout=Q.spout.shift()??1e12}
  spouts=spouts.filter(p=>p.x>camX-400);
  while(nextGeo<ahead){if(!blocked(nextGeo)&&!busyNear(nextGeo))geos.push({x:nextGeo,t:Math.random()*2.6,used:-1});nextGeo+=(4200+Math.random()*2400)*(bDom(nextGeo)===3?.55:1)}
  geos=geos.filter(g=>g.x>camX-200);
  while(nextDuck<ahead){if(!blockedRock(nextDuck)&&!busyNear(nextDuck))ducks.push({x:nextDuck,got:false,p:Math.random()*6});nextDuck+=3000+Math.random()*1800}
  ducks=ducks.filter(d=>d.x>camX-200&&!d.got);
  while(nextBottle<ahead){if(!blockedRock(nextBottle)&&!busyNear(nextBottle))bottles.push({x:nextBottle,got:false,p:Math.random()*6});nextBottle+=3600+Math.random()*2000}
  bottles=bottles.filter(o=>o.x>camX-200&&!o.got);
  while(nextFish<ahead){if(!busyNear(nextFish)&&(!blocked(nextFish)||inStorm(nextFish))){const n=4+Math.floor(Math.random()*4);for(let i=0;i<n;i++)fishes.push({x:nextFish+i*26,y:Y0+30,vx:-1.6,vy:0,d:i*.11,on:false,got:false,t:0})}nextFish+=(2400+Math.random()*1800)*(bDom(nextFish)===2?.45:1)}
  fishes=fishes.filter(f=>f.x>camX-200&&!(f.on&&f.y>Y0+60));
  whales=whales.filter(w=>w.x>camX-300);
  rocks=rocks.filter(r=>r.x>camX-200);lanterns=lanterns.filter(l=>l.x>camX-100&&!(l.got&&l.t>1));
}
function whaleY(w){const t=w.t;const up=Math.min(1,t/1.4),dn=t>4.4?Math.min(1,(t-4.4)/1.4):0;const e=u=>u*u*(3-2*u);return surf(w.x)+90-e(up)*92+e(dn)*130}
function makePlan(){STORMS=[];Q={whale:[],spout:[],surf:[],boss:[],storm:[]};let x=2600+Math.random()*900,last='',sinceBoss=0;
  const LEN={whale:1600,storm:1600,surf:3800,spout:4600,boss:8000};
  while(x<400000){const W0={whale:mut===2?9:3,storm:2.2,surf:2,spout:2,boss:(x>(mut===6?4000:13000)&&sinceBoss>=(mut===6?1:3))?(mut===6?6:1.4):0};
    if(x>(mut===6?4000:13000)&&sinceBoss>=(mut===6?1:4))for(const q in W0)if(q!=='boss')W0[q]=0;
    if(last&&last!=='boss')W0[last]=0;let tot=0;for(const k in W0)tot+=W0[k];let r=Math.random()*tot,k='whale';for(const q in W0){r-=W0[q];if(r<=0){k=q;break}}
    Q[k].push(x);if(k==='storm')STORMS.push([x,x+1500]);sinceBoss=k==='boss'?0:sinceBoss+1;last=k;
    x+=LEN[k]+2600+Math.random()*2000}
  nextWhale=Q.whale.shift()??1e12;nextSpout=Q.spout.shift()??1e12;nextSurf=Q.surf.shift()??1e12;nextBoss=Q.boss.shift()??1e12}
function busyNear(x){const near=a=>a.some(o=>Math.abs(o.x-x)<650);return near(ducks)||near(bottles)||near(oris)||near(cranes)||near(geos)||near(fishes)||near(gulls)}
function inStorm(x){for(const z of STORMS){if(x<z[0])return false;if(x<z[1])return true}return false}
function blocked(x){
  if(inStorm(x)||inStorm(x+300))return true;

let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(.1,(now-last)/1000)*slow;last=now;
  let n=0;while(acc>=1/60&&n<4){try{update()}catch(e){console.error(e)}acc-=1/60;n++}if(n>=4)acc=0;
  try{render()}catch(e){console.error(e)}requestAnimationFrame(frame);
}
